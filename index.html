<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English Sentence Game</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="#/">
    <span class="brand-mark">ESG</span>
    <span class="brand-name">English Sentence Game</span>
  </a>
  <nav class="topbar-actions">
    <span id="streak" class="streak" hidden></span>
    <button id="settings-btn" class="icon-btn" type="button" title="Settings">Settings</button>
  </nav>
</header>

<main id="view" class="view" aria-live="polite">
  <div class="loading">Loading decks…</div>
</main>

<dialog id="settings-dialog" class="dialog">
  <form method="dialog" class="dialog-body">
    <h2>Settings</h2>

    <label class="field">
      <span class="field-label">Cards per session</span>
      <select id="set-session-size">
        <option value="5">5</option>
        <option value="10">10</option>
        <option value="20">20</option>
        <option value="0">All due</option>
      </select>
    </label>

    <label class="field checkbox">
      <input type="checkbox" id="set-show-ko">
      <span>Show the Korean prompt</span>
    </label>

    <label class="field checkbox">
      <input type="checkbox" id="set-speak-reveal">
      <span>Read the sentence aloud after each answer</span>
    </label>

    <label class="field checkbox">
      <input type="checkbox" id="set-requeue">
      <span>Repeat missed sentences at the end of a session</span>
    </label>

    <label class="field">
      <span class="field-label">Speech speed</span>
      <input type="range" id="set-rate" min="0.5" max="1.2" step="0.1">
      <span id="set-rate-out" class="field-out"></span>
    </label>

    <div class="dialog-actions">
      <button type="button" id="reset-progress" class="btn btn-ghost btn-danger">Reset all progress</button>
      <button value="close" class="btn btn-primary">Done</button>
    </div>
  </form>
</dialog>

<script type="module" src="js/app.js"></script>
</body>
</html>
